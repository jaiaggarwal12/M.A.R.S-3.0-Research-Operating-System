##############################################################
#  M.A.R.S 4.0 — Render.com Deployment
#  Two services: FastAPI (API) + Gradio (UI)
##############################################################

services:

  # ── FastAPI backend ──────────────────────────────────────
  - type: web
    name: mars-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python main.py --serve
    plan: starter          # free tier; upgrade to standard for more RAM
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false        # set in Render dashboard → Environment
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TEMPERATURE
        value: "0.1"
      - key: NEO4J_URI
        sync: false        # set in Render dashboard
      - key: NEO4J_USER
        value: b9cde491
      - key: NEO4J_PASSWORD
        sync: false        # set in Render dashboard
      - key: NEO4J_DATABASE
        value: b9cde491
      - key: FAISS_INDEX_PATH
        value: /app/data/faiss_index
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MEMORY_DB_PATH
        value: /app/data/memory/research_memory.json
      - key: EXPERIMENT_HISTORY_DB
        value: /app/data/memory/experiments.db
      - key: EXPERIMENTS_DIR
        value: /app/data/experiments
      - key: TWIN_PAPERS_DIR
        value: /app/data/twin_papers
      - key: LOG_FILE
        value: /app/data/logs/mars.log
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: MAX_PAPERS_PER_QUERY
        value: "50"
      - key: MAX_LOOP_ITERATIONS
        value: "3"
      - key: AUTO_LOOP_ENABLED
        value: "false"
      - key: EXPERIMENT_RUNNER
        value: local
      - key: EXPERIMENT_TIMEOUT_SECONDS
        value: "180"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true

  # ── Gradio frontend ──────────────────────────────────────
  - type: web
    name: mars-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python main.py --ui
    plan: starter
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TEMPERATURE
        value: "0.1"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: b9cde491
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: b9cde491
      - key: FAISS_INDEX_PATH
        value: /app/data/faiss_index
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MEMORY_DB_PATH
        value: /app/data/memory/research_memory.json
      - key: EXPERIMENT_HISTORY_DB
        value: /app/data/memory/experiments.db
      - key: EXPERIMENTS_DIR
        value: /app/data/experiments
      - key: TWIN_PAPERS_DIR
        value: /app/data/twin_papers
      - key: LOG_FILE
        value: /app/data/logs/mars.log
      - key: MAX_PAPERS_PER_QUERY
        value: "50"
      - key: MAX_LOOP_ITERATIONS
        value: "3"
      - key: AUTO_LOOP_ENABLED
        value: "false"
      - key: EXPERIMENT_RUNNER
        value: local
      - key: EXPERIMENT_TIMEOUT_SECONDS
        value: "180"
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true
