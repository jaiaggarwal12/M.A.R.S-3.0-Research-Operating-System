version: "3.9"

##############################################################
#  M.A.R.S 4.0 — Local Docker Compose
#  Starts: Neo4j + FastAPI + Gradio UI
#  Usage:  docker-compose up --build
##############################################################

services:

  # ── Neo4j graph database ─────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: mars_neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/mars_password_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── FastAPI backend ──────────────────────────────────────
  mars_api:
    build: .
    container_name: mars_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override Neo4j URI to point to local container
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mars_password_2024
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - mars_data:/app/data
    command: python main.py --serve
    restart: unless-stopped

  # ── Gradio UI ────────────────────────────────────────────
  mars_ui:
    build: .
    container_name: mars_ui
    ports:
      - "7860:7860"
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mars_password_2024
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - mars_data:/app/data
    command: python main.py --ui
    restart: unless-stopped

volumes:
  neo4j_data:
  mars_data:
